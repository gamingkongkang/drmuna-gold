<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muna Gold — Simpan Emas Dengan Lebih Mudah</title>
<style>
:root{--bg:#0d0c09;--panel:#17140f;--gold:#d6b15a;--gold2:#f2dc98;--text:#f8f1e4;--muted:#aaa296;--line:rgba(214,177,90,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1140px,calc(100% - 30px));margin:auto}
nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}
.mark{width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:22px Georgia,serif}
.navlinks{display:flex;gap:22px;color:var(--muted);font-size:14px}.navright{display:flex;gap:10px;align-items:center}
.switch{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}.switch button{border:0;background:transparent;color:var(--muted);border-radius:999px;min-width:48px;min-height:38px;font-weight:800;cursor:pointer}
.switch button.active{background:var(--gold);color:#171208}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:13px 19px;min-height:44px;font-weight:800;border:1px solid var(--line)}
.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#19150c;border:0}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center;padding:75px 0}
.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.04em}
h1{font-size:clamp(48px,7vw,86px);line-height:.98;margin:18px 0 20px}h2{font-size:clamp(36px,5vw,54px);margin:0}.gold{color:var(--gold)}
.lead{font-size:clamp(17px,2vw,21px);line-height:1.65;color:var(--muted);max-width:650px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.visual{display:grid;place-items:center;min-height:390px;position:relative}.halo{position:absolute;width:min(390px,90%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(242,220,152,.2),rgba(214,177,90,.06) 52%,transparent 70%)}
.coin{width:min(300px,78%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#f9e3a0,#d5aa47 30%,#8c661b 68%,#5d3e0b);box-shadow:0 35px 75px rgba(0,0,0,.35),inset 0 0 0 10px rgba(255,255,255,.08),inset 0 0 0 15px rgba(50,30,0,.2);transform:rotate(-7deg)}
.coin b{display:block;font:76px/.85 Georgia,serif;color:#553707;text-align:center}.coin span{display:block;color:#5b3d0a;letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:900;text-align:center}
.section{padding:65px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.head p{max-width:450px;color:var(--muted);line-height:1.6;margin:0}
.calc{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--panel)}.controls,.result{padding:34px}.controls{border-right:1px solid var(--line)}
.field{margin-bottom:25px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:10px;font-weight:800}.value{color:var(--gold)}input[type=range]{width:100%;accent-color:var(--gold)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.presets button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:9px 13px;cursor:pointer}.presets button.active{background:var(--gold);color:#171208;border-color:var(--gold);font-weight:800}
.result{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,rgba(214,177,90,.08),transparent 68%)}.result small{color:var(--muted);text-transform:uppercase;letter-spacing:.13em;font-weight:800}.big{font:clamp(46px,7vw,76px)/1 Georgia,serif;color:var(--gold);margin:10px 0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.metric{border:1px solid var(--line);border-radius:16px;padding:15px}.metric b{display:block;margin-top:5px}.note{font-size:12px;color:#928a7e;line-height:1.5}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{border-top:1px solid var(--line);padding:24px}.num{color:var(--gold);font:28px Georgia,serif}.feature h3{margin:18px 0 8px}.feature p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.cta{margin:60px 0 30px;padding:38px;border:1px solid var(--line);border-radius:26px;background:#15130f;display:flex;align-items:center;justify-content:space-between;gap:22px}.cta h3{font:38px Georgia,serif;margin:0 0 8px}.cta p{margin:0;color:var(--muted)}
footer{padding:22px 0 40px;color:#827a70;font-size:13px}
@media(max-width:900px){.navlinks{display:none}}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:42px}.visual{min-height:330px}.calc{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}.features{grid-template-columns:1fr}.head{display:block}.head p{margin-top:12px}.cta{display:block}.cta .btn{margin-top:18px}}
@media(max-width:520px){nav{flex-wrap:wrap;align-items:flex-start}.navright{width:100%;justify-content:space-between}.controls,.result{padding:22px}.metrics{grid-template-columns:1fr}.cta{padding:25px}}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="brand"><div class="mark">M</div>MUNA GOLD</div>
  <div class="navlinks"><a href="#why" data-t="navWhy"></a><a href="#calculator" data-t="navCalc"></a><a href="#start" data-t="navStart"></a></div>
  <div class="navright">
    <div class="switch" aria-label="Language switch"><button class="lang active" data-lang="ms">BM</button><button class="lang" data-lang="en">EN</button></div>
    <a class="btn" href="#calculator" data-t="navTry"></a>
  </div>
</nav>

<section class="hero">
  <div>
    <div class="eyebrow" data-t="heroEyebrow"></div>
    <h1 data-th="heroTitle"></h1>
    <p class="lead" data-t="heroLead"></p>
    <div class="actions"><a class="btn primary" href="#calculator" data-t="heroPrimary"></a><a class="btn" href="#why" data-t="heroSecondary"></a></div>
  </div>
  <div class="visual"><div class="halo"></div><div class="coin"><div><b>Au</b><span data-t="coin"></span></div></div></div>
</section>

<section class="section" id="calculator">
  <div class="head"><div><div class="eyebrow" data-t="calcEyebrow"></div><h2 data-t="calcTitle"></h2></div><p data-t="calcIntro"></p></div>
  <div class="calc">
    <div class="controls">
      <div class="field">
        <div class="row"><label for="monthly" data-t="monthlyLabel"></label><span id="monthlyValue" class="value"></span></div>
        <input id="monthly" type="range" min="100" max="3000" step="50" value="500">
        <div class="presets"><button data-v="100">RM100</button><button data-v="500" class="active">RM500</button><button data-v="1000">RM1,000</button><button data-v="2000">RM2,000</button></div>
      </div>
      <div class="field">
        <div class="row"><label for="years" data-t="yearsLabel"></label><span id="yearsValue" class="value"></span></div>
        <input id="years" type="range" min="1" max="20" value="5">
      </div>
      <p class="note" data-t="calcNote"></p>
    </div>
    <div class="result" aria-live="polite">
      <small data-t="resultLabel"></small>
      <div class="big"><span id="grams"></span> g</div>
      <div><span data-t="fromText"></span> <strong id="total"></strong></div>
      <div class="metrics">
        <div class="metric"><small data-t="metricMonthly"></small><b id="mMetric"></b></div>
        <div class="metric"><small data-t="metricDuration"></small><b id="dMetric"></b></div>
        <div class="metric"><small data-t="metricPrice"></small><b>RM650/g</b></div>
        <div class="metric"><small data-t="metricFreq"></small><b data-t="monthlyFreq"></b></div>
      </div>
    </div>
  </div>
</section>

<section class="section" id="why">
  <div class="head"><div><div class="eyebrow" data-t="whyEyebrow"></div><h2 data-t="whyTitle"></h2></div><p data-t="whyIntro"></p></div>
  <div class="features">
    <div class="feature"><div class="num">01</div><h3 data-t="f1Title"></h3><p data-t="f1Text"></p></div>
    <div class="feature"><div class="num">02</div><h3 data-t="f2Title"></h3><p data-t="f2Text"></p></div>
    <div class="feature"><div class="num">03</div><h3 data-t="f3Title"></h3><p data-t="f3Text"></p></div>
  </div>
</section>

<section class="cta" id="start">
  <div><h3 data-t="ctaTitle"></h3><p data-t="ctaText"></p></div>
  <button class="btn primary" id="testBtn" data-t="ctaButton"></button>
</section>

<footer data-t="footer"></footer>
</div>

<script>
const T={
ms:{
title:"Muna Gold — Simpan Emas Dengan Lebih Mudah",navWhy:"Kenapa Emas",navCalc:"Kalkulator",navStart:"Mula",navTry:"Cuba Kalkulator",
heroEyebrow:"Simpan emas dengan lebih mudah",heroTitle:'Tukar simpanan kecil kepada <span class="gold">emas sebenar.</span>',heroLead:"Laman web moden dan mesra pemula untuk membantu orang ramai memahami simpanan emas, mencuba pelan simpanan sendiri dan mengambil langkah seterusnya dengan lebih yakin.",heroPrimary:"Bina pelan emas saya",heroSecondary:"Ketahui lebih lanjut",coin:"Emas 999.9",
calcEyebrow:"Demo interaktif",calcTitle:"Bina pelan anda.",calcIntro:"Gerakkan slider dan keputusan akan berubah serta-merta. Inilah jenis interaksi yang boleh kita kembangkan dalam laman web sebenar.",monthlyLabel:"Simpanan bulanan",yearsLabel:"Tempoh simpanan",calcNote:"Andaian prototaip sahaja: RM650/g. Ini bukan harga emas semasa atau unjuran pulangan.",
resultLabel:"Anggaran emas terkumpul",fromText:"daripada jumlah simpanan",metricMonthly:"Bulanan",metricDuration:"Tempoh",metricPrice:"Harga contoh",metricFreq:"Kekerapan",monthlyFreq:"Bulanan",
whyEyebrow:"Strategi laman web",whyTitle:"Berguna, bukan sekadar cantik.",whyIntro:"Laman web akhir perlu mendidik, membina kepercayaan dan membawa pelawat kepada satu tindakan yang jelas.",
f1Title:"Terangkan dengan cepat",f1Text:"Penerangan visual yang ringkas untuk pelawat yang baru mahu memahami simpanan emas.",f2Title:"Jadikan ia interaktif",f2Text:"Kalkulator, perbandingan dan alat kemajuan membuatkan pelawat lebih aktif berinteraksi.",f3Title:"Jana leads",f3Text:"Butang tindakan boleh disambungkan terus ke WhatsApp atau borang lead yang selamat.",
ctaTitle:"Bersedia untuk versi sebenar?",ctaText:"Selepas ini kita boleh tambah branding sebenar, WhatsApp, FAQ, bahagian tentang anda, pendidikan produk dan pengumpulan leads.",ctaButton:"Uji interaksi",footer:"Prototaip Muna Gold • Untuk tujuan demonstrasi pendidikan sahaja.",year:"tahun",years:"tahun",month:"bulan",months:"bulan",alert:"JavaScript laman web berfungsi ✅"
},
en:{
title:"Muna Gold — Gold Saving Made Simple",navWhy:"Why Gold",navCalc:"Calculator",navStart:"Start",navTry:"Try Calculator",
heroEyebrow:"Gold saving, made simple",heroTitle:'Turn small savings into <span class="gold">real gold.</span>',heroLead:"A modern, beginner-friendly website that helps visitors understand gold saving, explore a personal saving plan and take the next step with confidence.",heroPrimary:"Build my gold plan",heroSecondary:"Learn more",coin:"999.9 Gold",
calcEyebrow:"Interactive demo",calcTitle:"Build your plan.",calcIntro:"Move the sliders and the result updates instantly. This is the type of interaction we can expand in the real website.",monthlyLabel:"Monthly saving",yearsLabel:"Saving period",calcNote:"Prototype assumption only: RM650/g. This is not a live gold quotation or a return projection.",
resultLabel:"Illustrative gold accumulated",fromText:"from total contributions",metricMonthly:"Monthly",metricDuration:"Duration",metricPrice:"Sample price",metricFreq:"Frequency",monthlyFreq:"Monthly",
whyEyebrow:"Website strategy",whyTitle:"Useful, not just pretty.",whyIntro:"The finished site should educate, build trust and move visitors toward one clear action.",
f1Title:"Educate quickly",f1Text:"Short visual explanations for visitors who are new to gold saving.",f2Title:"Make it interactive",f2Text:"Calculators, comparisons and progress tools encourage visitors to engage rather than just read.",f3Title:"Generate leads",f3Text:"Strong calls-to-action can connect directly to WhatsApp or a secure lead form.",
ctaTitle:"Ready for the real version?",ctaText:"Next we can add your actual branding, WhatsApp, FAQ, about section, product education and lead capture.",ctaButton:"Test interaction",footer:"Muna Gold prototype • Educational demonstration only.",year:"year",years:"years",month:"month",months:"months",alert:"Website JavaScript is working ✅"
}};
let lang="ms";
const monthly=document.getElementById("monthly"),years=document.getElementById("years");
const money=n=>"RM"+Math.round(n).toLocaleString("en-MY");
function update(){
 const t=T[lang],m=+monthly.value,y=+years.value,total=m*y*12,mos=y*12;
 document.getElementById("monthlyValue").textContent=money(m);
 document.getElementById("yearsValue").textContent=y+" "+(y===1?t.year:t.years);
 document.getElementById("grams").textContent=(total/650).toFixed(2);
 document.getElementById("total").textContent=money(total);
 document.getElementById("mMetric").textContent=money(m);
 document.getElementById("dMetric").textContent=mos+" "+(mos===1?t.month:t.months);
 document.querySelectorAll(".presets button").forEach(b=>b.classList.toggle("active",+b.dataset.v===m));
}
function apply(l){
 lang=l;const t=T[l];document.documentElement.lang=l==="ms"?"ms":"en";document.title=t.title;
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
 document.querySelectorAll("[data-th]").forEach(el=>el.innerHTML=t[el.dataset.th]);
 document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));update();
}
monthly.addEventListener("input",update);years.addEventListener("input",update);
document.querySelectorAll(".presets button").forEach(b=>b.addEventListener("click",()=>{monthly.value=b.dataset.v;update()}));
document.querySelectorAll(".lang").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
document.getElementById("testBtn").addEventListener("click",()=>alert(T[lang].alert));
apply("ms");
</script>
</body>
</html>
